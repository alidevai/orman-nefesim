# Risk verisini günlük yeniler ve siteyi yeniden yayınlar.
#
# NEDEN BU TASARIM:
# - Çıktı bir DALA COMMIT EDİLMEZ, artifact olarak yayınlanır. risk.geojson her
#   koşuda baştan sona değişir ve git onu sıkıştıramaz; commit'lenseydi depo
#   yılda ~5 GB büyürdü. Artifact yöntemiyle depo ~16 MB'da sabit kalır.
# - HİÇBİR SIR SAKLANMAZ. Kaynak depo public olduğu için yerleşik GITHUB_TOKEN
#   ile çekilebiliyor; yayın da bu deponun kendisine yapıldığı için yine yerleşik
#   token yetiyor. PAT veya deploy key gerekmez.
# - GitHub, 60 gün COMMIT olmayan public depolarda zamanlanmış iş akışlarını
#   devre dışı bırakır. Tag/issue sayılmaz. Bu yüzden her koşu son-guncelleme.txt
#   dosyasına küçük bir commit atar; cron kendi kendini canlı tutar.

name: Veriyi yenile ve yayınla

on:
  schedule:
    - cron: "0 3 * * *" # 06:00 TSİ (UTC+3)
  workflow_dispatch: # elle tetikleme

permissions:
  contents: write # son-guncelleme.txt commit'i (60 gün kuralı)
  pages: write
  id-token: write

# Aynı anda tek yayın; elle tetikleme ile cron çakışırsa sıraya girer.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  KAYNAK_DEPO: alidevai/orman-nefesim-kod

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}

    steps:
      - name: Site deposunu çek
        uses: actions/checkout@v4

      - name: Kaynak kodu çek
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KAYNAK_DEPO }}
          path: kod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kod/apps/web/package-lock.json

      - name: Python bağımlılıkları
        run: pip install "h3>=4,<5" httpx

      - name: Risk verisini üret (canlı Open-Meteo)
        working-directory: kod
        run: |
          python scripts/build_risk_geojson.py \
            --aoi turkey \
            --out apps/web/public/data/risk.geojson
          # Üretim başarısızsa BOŞ site yayınlamayalım: dosya var ve makul
          # büyüklükte mi diye bak. Sessiz bozuk yayın, hatadan daha kötüdür.
          boyut=$(stat -c%s apps/web/public/data/risk.geojson)
          echo "risk.geojson: $((boyut / 1024 / 1024)) MB"
          test "$boyut" -gt 1000000

      - name: Web derle (statik)
        working-directory: kod/apps/web
        run: |
          npm ci
          npx next build

      - name: Yayın paketini hazırla
        run: |
          rm -rf yayin && mkdir yayin
          cp -r kod/apps/web/out/. yayin/
          # Jekyll alt çizgiyle başlayan _next/ dizinini yok sayar -> tüm JS 404.
          touch yayin/.nojekyll
          cp README.md yayin/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: yayin

      - name: GitHub Pages'e yayınla
        id: yayin
        uses: actions/deploy-pages@v4

      - name: Cron'u canlı tut (60 gün kuralı)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > son-guncelleme.txt
          git config user.name "alidevai"
          git config user.email "holladevai@gmail.com"
          git add son-guncelleme.txt
          git diff --staged --quiet || git commit -m "Veri yenilendi: $(cat son-guncelleme.txt)"
          git push
